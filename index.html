html,body{height:100%}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);

.sr{display:none}

.icon-btn.arm{background:var(--ac)}
.icon-btn.arm svg path{stroke:#fff}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #f3d9ea}
#effects{display:flex;gap:6px;height:22px;margin:2px 0;font-size:.75rem;font-weight:700;white-space:nowrap}
.chip{padding:1px 10px;border-radius:999px}
#targetCard{position:relative;width:calc(100% - 48px);max-width:720px;background:var(--card);border:3px solid #fff;box-shadow:0 4px 0 #f3d9ea;border-radius:28px;padding:8px 24px;display:flex;align-items:center;justify-content:center;gap:16px}
#hintEmoji{flex:none;width:64px;height:64px;background:#fdeef6;border:0;border-radius:50%;padding:9px}

section{flex:1;min-height:0;width:100%;max-width:1400px;padding:14px 28px 22px;display:flex;align-items:stretch}

.hole-container{container-type:size;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;width:100%;height:100%;border-radius:28px}
.pit{position:absolute;bottom:0;width:100%;height:80%}
.pit svg,.grass svg{width:100%;height:100%}
.grass{position:absolute;bottom:0;width:100%;height:22%;pointer-events:none;z-index:20}
.mole-wrapper{position:absolute;bottom:8px;left:0;right:0;margin:0 auto;width:min(80cqw,calc(80cqh*.909));height:min(80cqh,calc(80cqw*1.1));display:flex;align-items:flex-end;justify-content:center;transition:transform .2s cubic-bezier(.34,1.56,.64,1);transform:translateY(115%);cursor:inherit}
.hole-container.up .mole-wrapper{transform:translateY(0)}
.mole-wrapper.hit{transform:translateY(20%) scale(.9,.7)!important;transition:transform .08s ease-in}
.mw-in{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.art{width:100%;height:100%}
.badge{position:absolute;left:50%;top:50%;width:40%;aspect-ratio:1;transform:translateX(-50%);background:#fff;border:4px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #f3d9ea,0 0 0 3px var(--gold)}
.float-text{position:fixed;z-index:50;font-weight:700;font-size:1.4rem;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;animation:floatUp .85s forwards}

.combo{display:inline-flex;align-items:center;gap:2px}
.chip{display:inline-flex;align-items:center;gap:4px}
.float-text{display:flex;align-items:center;gap:4px;white-space:nowrap}
.row span:first-child{display:flex;align-items:center;gap:6px}
.muted{display:flex;justify-content:center;flex-wrap:wrap;gap:2px 10px}
.lg{display:inline-flex;align-items:center;gap:3px}
.mole-char{display:flex;color:var(--ac)}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-45px)}}
@keyframes shake{0%,100%{transform:translateX(0)}30%,70%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.animate-shake{animation:shake .4s ease-in-out}
#gameModal{position:fixed;inset:0;z-index:50;background:#4a3b5c66;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.panel{background:var(--card);border:5px solid #fff;box-shadow:0 8px 0 #f3d9ea,0 24px 50px #b794f655;border-radius:36px;padding:22px 26px;width:100%;max-width:420px;text-align:center;max-height:96dvh;overflow:auto}
#modalTitle{font-size:1.6rem;font-weight:700;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
#modalDesc{font-size:.9rem;color:var(--mut);margin:2px 0 10px}
#finalStats{display:flex;justify-content:space-around;background:linear-gradient(135deg,#ffe8f3,#ece4ff);border-radius:22px;padding:8px;margin-bottom:10px}
#finalStats div{display:flex;flex-direction:column;font-size:.75rem;color:var(--mut)}
#finalStats b{font-size:1.3rem;color:var(--ac)}
#playerName{width:100%;padding:9px 12px;background:#fff;border:3px solid var(--line);border-radius:999px;text-align:center;font-size:1.1rem;font-weight:600;color:var(--ink);outline:none;font-family:inherit;user-select:text;-webkit-user-select:text}
#playerName:focus{border-color:var(--ac2);box-shadow:0 0 0 4px #b794f633}
.modes{display:flex;gap:8px;margin:8px 0}
.mode-btn{flex:1;padding:7px 0;border-radius:999px;border:3px solid var(--line);background:#fff;color:var(--mut);font-weight:700;font-size:1rem;font-family:inherit;cursor:inherit}
.mode-btn.sel{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:#fff;color:#fff;box-shadow:0 3px 0 #d96aa4}
#board{list-style:none;padding:6px 12px;background:#fff4fa;border:3px dashed var(--line);border-radius:20px;margin-bottom:8px;font-size:.85rem;font-weight:600;text-align:left}
.row{display:flex;justify-content:space-between;padding:1px 4px;border-radius:8px}
.row.hi{background:#fff0c9;color:#d9822b}
.empty{text-align:center;color:#b9a8c4}
.muted{font-size:.75rem;color:var(--mut);margin-bottom:10px}
.play{width:100%;border:4px solid #fff;border-radius:999px;padding:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:1.3rem;font-weight:700;font-family:inherit;letter-spacing:.08em;box-shadow:0 6px 0 #d96aa4,0 12px 20px #ff7eb655;cursor:inherit}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #d96aa4}
#frostFx,#particleCanvas{position:fixed;inset:0;pointer-events:none}
#frostFx{z-index:30}#particleCanvas{z-index:40}
</style>
</head>
<body>
<header class="bar">
 <div class="stat"><i data-ic="star"></i><span id="score">0</span><span id="comboBadge" class="combo hidden"><i data-ic="fire"></i><span id="comboCount">2</span> <span id="comboMult">x1</span></span></div>

</div></div>

// Sound
let soundOn = true, actx = null;
function beep(f1,f2,dur,type,vol){
 if(!soundOn) return;
 try{
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
  o.connect(g); g.connect(actx.destination); o.type=type;
  o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.01,t+dur);
  o.start(); o.stop(t+dur);
 }catch(e){}
}
function toggleSound(){
 soundOn=!soundOn;
 if(!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel();
 document.getElementById('soundIcon').innerHTML = ic(soundOn?'volOn':'volOff');
 document.getElementById('soundLabel').textContent = soundOn?'Sound ON':'Muted';
}
// Prefer the most natural-sounding English voice the device offers.
let bestVoice=null;
function pickVoice(){
 if(!('speechSynthesis' in window)) return;
 const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
 const prefs=[/natural|neural|online/i,/google us english/i,/samantha|ava|allison|zoe/i,/aria|jenny|google uk english female|karen|serena/i];
 for(const re of prefs){const v=vs.find(v=>re.test(v.name)); if(v){bestVoice=v; return;}}
 bestVoice=vs.find(v=>v.lang==='en-US')||vs[0]||null;
}
if('speechSynthesis' in window){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;}
function say(text,rate){
 if(!soundOn || !('speechSynthesis' in window)) return;
 const u=new SpeechSynthesisUtterance(text);
 if(bestVoice){u.voice=bestVoice; u.lang=bestVoice.lang;} else u.lang='en-US';
 u.rate=rate||.9; u.pitch=1.05; u.volume=1;
 speechSynthesis.speak(u);
}

// Unbiased shuffle (Fisher-Yates)
function shuffle(a){
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
 return a;
}

 wrappers=[...g.querySelectorAll(".mole-wrapper")];
 bindHoles();
}

function cur(){return vocabList[currentIndex];}

// Player name, game length and best scores (saved in this browser only)
let duration=30, playerName="";
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function boardKey(){return "moleBoard"+duration+"_"+level;}
function getBoard(){try{const a=JSON.parse(lsGet(boardKey()));return Array.isArray(a)?a:[];}catch(e){return [];}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function showBest(hi){   // hi = row of the game just played, to highlight
 const b=getBoard(), medals=[ic("m1"),ic("m2"),ic("m3"),"4.","5."];
 $("board").innerHTML=b.length?b.map((e,i)=>`<li class="row${i===hi?" hi":""}"><span>${medals[i]} ${esc(e.name)}</span><span>${e.score}</span></li>`).join(""):`<li class="empty">No scores yet for ${duration}s · ${level}</li>`;
}
function setMode(t){
 duration=t;
 document.querySelectorAll(".mode-btn[data-t]").forEach(b=>b.classList.toggle("sel",+b.dataset.t===t));
 lsSet("moleMode",t); showBest();
}
document.querySelectorAll(".mode-btn[data-t]").forEach(b=>b.addEventListener("click",()=>setMode(+b.dataset.t)));
function setLevel(l){
 level=l;
 document.querySelectorAll(".mode-btn[data-l]").forEach(b=>b.classList.toggle("sel",b.dataset.l===l));
 lsSet("moleLevel",l); buildGrid(); showBest();
}
document.querySelectorAll(".mode-btn[data-l]").forEach(b=>b.addEventListener("click",()=>setLevel(b.dataset.l)));
$("playerName").value=lsGet("moleName")||"";
const savedMode=+lsGet("moleMode");
setMode([30,45,60].includes(savedMode)?savedMode:30);
setLevel(LEVELS[lsGet("moleLevel")]?lsGet("moleLevel"):"easy");

function startGame(){
 playerName=($("playerName").value||"").trim()||"Player";
 lsSet("moleName",playerName);
 $("gameModal").classList.add("hidden");
 score=0; timeLeft=duration; combo=0; locked=false;
 clearTimeout(nextTimer);
 Object.keys(fx).forEach(k=>fx[k]=0);
 clearInterval(fxTimer); fxTimer=setInterval(renderFx,200); renderFx(); totalHits=0; correctHits=0; running=true;
 $("score").textContent=0; $("timer").textContent=timeLeft; $("comboBadge").classList.add("hidden");
 vocabList=shuffle([...vocabDatabase]); currentIndex=0;
 loadLevel();
 clearInterval(timerInterval);
 timerInterval=setInterval(()=>{
  if(Date.now()<fx.freeze) return;   // time is frozen
  timeLeft--; $("timer").textContent=timeLeft;
  if(timeLeft<=0) endGame();
 },1000);
 scheduleCycle(400);
}

function loadLevel(){
 if(currentIndex>=vocabList.length){vocabList=shuffle([...vocabDatabase]); currentIndex=0;}
 const w=cur();
 $("wordDisplay").textContent=w.display;
 $("hintEmoji").innerHTML=ICONS[w.word]||w.emoji;
 // calm fade instead of bouncing the whole card
 const wd=$("wordDisplay"); wd.style.transition="none"; wd.style.opacity=.3;
 requestAnimationFrame(()=>{wd.style.transition="opacity .25s"; wd.style.opacity=1;});
}

function hideAll(){holes.forEach(h=>h.classList.remove("up"));}

function scheduleCycle(delay){
 clearTimeout(cycleTimer); clearTimeout(hideTimer);
 cycleTimer=setTimeout(popCycle,delay);
}

// Letters are assigned at pop-up time, so a visible mole never changes its letter.
// The correct letter is included ~85% of cycles so children rarely wait for nothing.
// ---- Special creatures & power-ups (not moles) ----
const fx={freeze:0,slow:0,fast:0,x2:0};   // end timestamps of active effects
let fxTimer=null;
const SPECIALS={
 super:{color:'#f08c00',label:ic('star'),svg:`<svg viewBox='0 0 100 110' class='w-full h-full' style='filter:drop-shadow(0 0 7px #ffd43b)'><g stroke='#7a4a00' stroke-width='3' stroke-linejoin='round'><ellipse cx='32' cy='18' rx='9' ry='17' fill='#fcc419'/><ellipse cx='68' cy='18' rx='9' ry='17' fill='#fcc419'/><path d='M10 108 C4 52 20 20 50 20 C80 20 96 52 90 108Z' fill='#fcc419'/></g><ellipse cx='32' cy='18' rx='4' ry='11' fill='#f5b895'/><ellipse cx='68' cy='18' rx='4' ry='11' fill='#f5b895'/><ellipse cx='50' cy='40' rx='23' ry='17' fill='#fff3bf' stroke='#7a4a00' stroke-width='2'/><polygon points='50,21 52,26 57.5,26.3 53.2,29.6 54.8,35 50,32 45.2,35 46.8,29.6 42.5,26.3 48,26' fill='#ff6b6b' stroke='#7a4a00' stroke-width='1.2'/><g stroke='#7a4a00' stroke-width='2'><circle cx='38' cy='43' r='6.5' fill='#fff'/><circle cx='62' cy='43' r='6.5' fill='#fff'/></g><circle cx='39' cy='44' r='4' fill='#1d1d2b'/><circle cx='61' cy='44' r='4' fill='#1d1d2b'/><circle cx='40.5' cy='42.5' r='1.6' fill='#fff'/><circle cx='62.5' cy='42.5' r='1.6' fill='#fff'/><ellipse cx='50' cy='50' rx='3.5' ry='2.5' fill='#e8956a'/><path d='M45 53 Q50 57 55 53' stroke='#7a4a00' stroke-width='2' fill='none' stroke-linecap='round'/><ellipse cx='28' cy='50' rx='4' ry='2.5' fill='#f5b895' opacity='.85'/><ellipse cx='72' cy='50' rx='4' ry='2.5' fill='#f5b895' opacity='.85'/><g stroke='#7a4a00' stroke-width='2'><ellipse cx='21' cy='70' rx='9' ry='7' fill='#fff3bf'/><ellipse cx='79' cy='70' rx='9' ry='7' fill='#fff3bf'/></g></svg>`},
 freeze:{color:'#1c7ed6',label:ic('snow'),svg:`<svg viewBox='0 0 100 110' class='w-full h-full' style='filter:drop-shadow(0 0 7px #74c0fc)'><path d='M10 108 C4 52 20 14 50 14 C80 14 96 52 90 108Z' fill='#228be6' stroke='#0b3d6e' stroke-width='3'/><path d='M50 24 C70 24 77 42 72 54 C66 62 34 62 28 54 C23 42 30 24 50 24Z' fill='#fff' stroke='#0b3d6e' stroke-width='2'/><g stroke='#0b3d6e' stroke-width='2.5'><path d='M31 26 C32 8 68 8 69 26Z' fill='#a5d8ff'/><rect x='29' y='24' width='42' height='6' rx='3' fill='#4dabf7'/><circle cx='50' cy='8' r='4.5' fill='#fff'/></g><circle cx='39' cy='40' r='4.5' fill='#1d1d2b'/><circle cx='61' cy='40' r='4.5' fill='#1d1d2b'/><circle cx='40.5' cy='38.5' r='1.6' fill='#fff'/><circle cx='62.5' cy='38.5' r='1.6' fill='#fff'/><polygon points='44,45 56,45 50,53' fill='#ff922b' stroke='#c2570c' stroke-width='1.5' stroke-linejoin='round'/><ellipse cx='31' cy='48' rx='4' ry='2.5' fill='#f5b895' opacity='.8'/><ellipse cx='69' cy='48' rx='4' ry='2.5' fill='#f5b895' opacity='.8'/><g stroke='#0b3d6e' stroke-width='2'><ellipse cx='21' cy='70' rx='9' ry='7' fill='#1971c2'/><ellipse cx='79' cy='70' rx='9' ry='7' fill='#1971c2'/></g></svg>`},
 slow:{color:'#2f9e44',label:ic('turtle'),svg:`<svg viewBox='0 0 100 110' class='w-full h-full' style='filter:drop-shadow(0 0 7px #8ce99a)'><path d='M8 108 C4 48 24 14 50 14 C76 14 96 48 92 108Z' fill='#37b24d' stroke='#1b5e20' stroke-width='3'/><g fill='#51cf66' stroke='#1b5e20' stroke-width='1.5'><ellipse cx='22' cy='42' rx='8' ry='11'/><ellipse cx='78' cy='42' rx='8' ry='11'/><ellipse cx='50' cy='20' rx='9' ry='5'/></g><ellipse cx='50' cy='42' rx='22' ry='16' fill='#c0eb75' stroke='#1b5e20' stroke-width='2'/><g stroke='#1b5e20' stroke-width='2'><circle cx='40' cy='38' r='6' fill='#fff'/><circle cx='60' cy='38' r='6' fill='#fff'/></g><circle cx='40.5' cy='40' r='3.6' fill='#1d1d2b'/><circle cx='60.5' cy='40' r='3.6' fill='#1d1d2b'/><circle cx='42' cy='38.5' r='1.3' fill='#fff'/><circle cx='62' cy='38.5' r='1.3' fill='#fff'/><path d='M33 36 Q40 29 47 36 M53 36 Q60 29 67 36' stroke='#1b5e20' stroke-width='2.2' fill='none' stroke-linecap='round'/><circle cx='47' cy='47' r='1.2' fill='#2f9e44'/><circle cx='53' cy='47' r='1.2' fill='#2f9e44'/><path d='M44 51 Q50 55 56 51' stroke='#1b5e20' stroke-width='2' fill='none' stroke-linecap='round'/><g stroke='#1b5e20' stroke-width='2'><ellipse cx='21' cy='70' rx='9' ry='7' fill='#94d82d'/><ellipse cx='79' cy='70' rx='9' ry='7' fill='#94d82d'/></g></svg>`},
 bad:{color:'#7048e8',label:ic('bat'),svg:`<svg viewBox='0 0 100 110' class='w-full h-full' style='filter:drop-shadow(0 0 7px #7048e8)'><g stroke='#2b0f66' stroke-width='3' stroke-linejoin='round'><polygon points='16,46 6,6 42,26' fill='#5f3dc4'/><polygon points='84,46 94,6 58,26' fill='#5f3dc4'/><path d='M10 108 C4 52 20 18 50 18 C80 18 96 52 90 108Z' fill='#7048e8'/></g><ellipse cx='50' cy='42' rx='22' ry='16' fill='#b197fc' stroke='#2b0f66' stroke-width='2'/><g stroke='#2b0f66' stroke-width='2'><circle cx='39' cy='40' r='6.5' fill='#fff'/><circle cx='61' cy='40' r='6.5' fill='#fff'/></g><circle cx='40' cy='41' r='4' fill='#e03131'/><circle cx='60' cy='41' r='4' fill='#e03131'/><circle cx='41.3' cy='39.8' r='1.3' fill='#fff'/><circle cx='61.3' cy='39.8' r='1.3' fill='#fff'/><path d='M30 30 L46 36 M70 30 L54 36' stroke='#2b0f66' stroke-width='3.2' stroke-linecap='round'/><ellipse cx='50' cy='47' rx='3' ry='2' fill='#2b0f66'/><path d='M40 50 Q50 58 60 50' stroke='#2b0f66' stroke-width='2.2' fill='none' stroke-linecap='round'/><g fill='#fff' stroke='#2b0f66' stroke-width='1'><polygon points='43,51 47,52.5 44.5,57'/><polygon points='57,51 53,52.5 55.5,57'/></g><g stroke='#2b0f66' stroke-width='2'><ellipse cx='21' cy='70' rx='9' ry='7' fill='#b197fc'/><ellipse cx='79' cy='70' rx='9' ry='7' fill='#b197fc'/></g></svg>`}
};
function pickSpecial(){const r=Math.random(); return r<.25?'super':r<.45?'freeze':r<.7?'slow':'bad';}
function speedFactor(){const n=Date.now(); return (n<fx.slow?1.6:1)*(n<fx.fast?.6:1);}   // >1 = slower
function comboMult(){return Math.min(3,1+Math.floor(combo/3)*.5);}   // x1 → x1.5 (3) → x2 (6) → … max x3 (12)
function renderFx(){
 const n=Date.now();
 const L=[['freeze',ic('snow')+' FROZEN','#bae6fd','#075985'],['slow',ic('turtle')+' SLOW','#bbf7d0','#166534'],['fast',ic('bolt')+' FAST','#ddd6fe','#5b21b6'],['x2',ic('star')+' x2','#fde68a','#92400e']];
 $('effects').innerHTML=L.filter(e=>n<fx[e[0]]).map(e=>`<span style='background:${e[2]};color:${e[3]}' class='chip'>${e[1]} ${Math.ceil((fx[e[0]]-n)/1000)}s</span>`).join('');
 $('frostFx').style.opacity=n<fx.freeze?1:0;
}
function hitSpecial(kind,x,y){
 const s=SPECIALS[kind], n=Date.now();
 spawnParticles(x,y,s.color);
 if(kind==='super'){fx.x2=n+8000; floatText(ic('star')+' x2 points!',x,y,s.color); beep(660,1320,.3,'sine',.25);}
 else if(kind==='freeze'){fx.freeze=n+5000; floatText(ic('snow')+' Time frozen!',x,y,s.color); beep(900,500,.35,'sine',.2);}
 else if(kind==='slow'){fx.slow=n+8000; fx.fast=0; floatText(ic('turtle')+' Slow-mo!',x,y,s.color); beep(300,200,.3,'sine',.2);}
 else{
  fx.fast=n+6000; fx.slow=0; combo=0; $('comboBadge').classList.add('hidden');
  score=Math.max(0,score-10); $('score').textContent=score; totalHits++;
  floatText(ic('bat')+' -10, fast!',x,y,s.color); beep(200,90,.35,'sawtooth',.2);
  const c=$('targetCard'); c.classList.add('animate-shake'); setTimeout(()=>c.classList.remove('animate-shake'),400);
 }
 renderFx();
}
function setMole(idx,ch){
 const wr=wrappers[idx];
 wr.dataset.kind='mole'; wr.dataset.char=ch;
 wr.querySelector('.art').innerHTML=moleSVG;
 wr.querySelector('.badge').style.borderColor='';
 const c=wr.querySelector('.mole-char'); c.style.color='#ff7eb6'; c.textContent=ch;
}
function setSpecial(idx,kind){
 const wr=wrappers[idx], s=SPECIALS[kind];
 wr.dataset.kind=kind; wr.dataset.char='';
 wr.querySelector('.art').innerHTML=s.svg;
 wr.querySelector('.badge').style.borderColor=s.color;
 const c=wr.querySelector('.mole-char'); c.style.color=s.color; c.innerHTML=s.label;
}
function popCycle(){
 if(!running) return;
 hideAll();
 const f=speedFactor(), w=cur(), L=LEVELS[level];
 const count=L.counts[Math.floor(Math.random()*L.counts.length)];
 const order=shuffle(Array.from({length:holes.length},(_,i)=>i));
 const dist=shuffle([...w.d]);
 const withCorrect=Math.random()<.85;
 order.slice(0,count).forEach((idx,k)=>{
  setMole(idx,(withCorrect&&k===0)?w.missing:dist[k]);
  holes[idx].classList.add('up');
 });
 if(Math.random()<L.sp){   // a special creature joins in
  const idx=order[count];
  setSpecial(idx,pickSpecial()); holes[idx].classList.add('up');
 }
 beep(360,720,.08,'sine',.12);
 hideTimer=setTimeout(hideAll,L.show*f);
 cycleTimer=setTimeout(popCycle,L.cyc*f);
}

// The whole hole is the hit area (bigger target = snappier feel)
function bindHoles(){holes.forEach((hole,i)=>{
 const wrapper=wrappers[i];
 hole.addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(!running || locked || !hole.classList.contains("up") || wrapper.classList.contains("hit")) return;
  wrapper.classList.add("hit");
  setTimeout(()=>{wrapper.classList.remove("hit"); hole.classList.remove("up");},100);
  const kind=wrapper.dataset.kind;
  const r=wrapper.getBoundingClientRect(), x=r.left+r.width/2, y=r.top;
  if(kind&&kind!=='mole'){hitSpecial(kind,x,y); return;}
  totalHits++;
  if(wrapper.dataset.char===cur().missing){
   correctHits++; combo++;
   const mult=comboMult();
   const pts=Math.round(10*mult)*(Date.now()<fx.x2?2:1);
   score+=pts; $("score").textContent=score;
   beep(523,1046,.25,'sine',.25);
   floatText(`+${pts} ${ic('sparkle')}`,x,y,"#16a34a"); spawnParticles(x,y,"#ffb3d4");
   $("comboCount").textContent=combo; $("comboMult").textContent="x"+mult;
   if(combo>=2) $("comboBadge").classList.remove("hidden");
   if(combo%3===0) floatText(ic("fire")+" COMBO x"+mult+"!",x,y-34,"#f76707");
   // Show the completed word and read it NOW (only after a correct answer), then move on.
   locked=true;
   const w=cur();
   $("wordDisplay").textContent=w.word.split("").join(" ");
   if('speechSynthesis' in window) speechSynthesis.cancel();
   say(w.word,.8);
   clearTimeout(cycleTimer); clearTimeout(hideTimer);
   setTimeout(hideAll,150);
   clearTimeout(nextTimer);
   nextTimer=setTimeout(()=>{
    locked=false;
    if(!running) return;
    currentIndex++; loadLevel(); scheduleCycle(300);
   },1100);
  }else{
   combo=0; $("comboBadge").classList.add("hidden");
   score=Math.max(0,score-5); $("score").textContent=score;
   beep(300,260,.13,'square',.16); setTimeout(()=>beep(300,260,.13,'square',.16),170);
   floatText("-5 "+ic("heart"),x,y,"#ff5252");
   const c=$("targetCard"); c.classList.add("animate-shake"); setTimeout(()=>c.classList.remove("animate-shake"),400);
  }
 });
});}

function floatText(text,x,y,color){
 const el=document.createElement("div");
 el.className="float-text";
 el.innerHTML=text; el.style.left=(x-20)+"px"; el.style.top=(y-20)+"px"; el.style.color=color;
 document.body.appendChild(el); setTimeout(()=>el.remove(),850);
}

// Particles (the animation loop only runs while particles exist)
const canvas=$("particleCanvas"), pctx=canvas.getContext("2d");
let particles=[], raf=0;
function resize(){canvas.width=innerWidth; canvas.height=innerHeight;}
addEventListener("resize",resize); resize();
function spawnParticles(x,y,color){
 for(let i=0;i<12;i++) particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7-1,r:Math.random()*5+3,color,a:1});
 if(!raf) raf=requestAnimationFrame(frame);
}
function frame(){
 pctx.clearRect(0,0,canvas.width,canvas.height);
 for(let i=particles.length-1;i>=0;i--){   // iterate backwards so splice is safe
  const p=particles[i];
  p.x+=p.vx; p.y+=p.vy; p.a*=.93;
  pctx.globalAlpha=p.a; pctx.fillStyle=p.color;
  pctx.beginPath(); pctx.arc(p.x,p.y,p.r,0,Math.PI*2); pctx.fill();
  if(p.a<.05) particles.splice(i,1);
 }
 pctx.globalAlpha=1;
 raf=particles.length?requestAnimationFrame(frame):0;
}

// Quit to the menu without saving a score
let quitArm=0;
function quitGame(){
 if(!running) return;
 // two-tap confirm (browser confirm() is blocked in some embedded views)
 const qb=$("quitBtn");
 if(Date.now()>quitArm){
  quitArm=Date.now()+2500; qb.classList.add("arm");
  setTimeout(()=>qb.classList.remove("arm"),2500);
  const r=qb.getBoundingClientRect();
  floatText("Tap again to quit",Math.max(8,r.left-110),r.bottom+6,"#ff7eb6");
  return;
 }
 quitArm=0; qb.classList.remove("arm");
 running=false; locked=false;
 clearInterval(timerInterval); clearTimeout(cycleTimer); clearTimeout(hideTimer); clearTimeout(nextTimer);
 clearInterval(fxTimer); Object.keys(fx).forEach(k=>fx[k]=0); renderFx();
 hideAll();
 if('speechSynthesis' in window) speechSynthesis.cancel();
 $("modalTitle").textContent="Mole Spelling";
 $("modalDesc").textContent="Whack the mole with the missing letter!";
 $("finalStats").classList.add("hidden");
 showBest();
 $("gameModal").classList.remove("hidden");
}
addEventListener("keydown",e=>{if(e.key==="Escape") quitGame();});

function endGame(){
 running=false; locked=false;
 clearInterval(timerInterval); clearTimeout(cycleTimer); clearTimeout(hideTimer); clearTimeout(nextTimer);
 clearInterval(fxTimer); Object.keys(fx).forEach(k=>fx[k]=0); renderFx();
 hideAll();
 const acc=totalHits>0?Math.round(correctHits/totalHits*100):0;
 const board=getBoard();
 let rank=-1;
 if(score>0){
  const entry={name:playerName,score,t:Date.now()};
  board.push(entry);
  board.sort((a,b)=>b.score-a.score||a.t-b.t);
  rank=board.indexOf(entry);
  if(rank>=5) rank=-1;
  board.length=Math.min(board.length,5);
  lsSet(boardKey(),JSON.stringify(board));
 }
 showBest(rank);
 $("modalTitle").textContent=(score>=Math.round(80*duration/30)?"SUPER AMAZING":"TIME’S UP")+", "+playerName+"!";
 $("modalDesc").textContent=(rank===0?"New record for "+duration+"s! ":rank>0?"You’re #"+(rank+1)+" on the board! ":"")+"Here is your spelling performance:";
 $("modalScore").textContent=score; $("modalWords").textContent=correctHits; $("modalAccuracy").textContent=acc+"%";
 $("finalStats").classList.remove("hidden");
 $("gameModal").classList.remove("hidden");
}
